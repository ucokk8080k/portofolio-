<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio // Pahri</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f7f9fd;--bg2:#c8d0dd;--ink:#1a2030;--ice:#79c1ee;--red:#d8344f;--card:rgba(255,255,255,.72);--bar:#1a2030;--barink:#fff;--stripe:rgba(121,193,238,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a1f2c;--bg2:#0b0d13;--ink:#eef2f9;--card:rgba(32,38,54,.75);--bar:#eef2f9;--barink:#161a24;--stripe:rgba(121,193,238,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1a1f2c;--bg2:#0b0d13;--ink:#eef2f9;--card:rgba(32,38,54,.75);--bar:#eef2f9;--barink:#161a24;--stripe:rgba(121,193,238,.1);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:Oswald,"Arial Narrow",sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,var(--stripe) 46px 92px);z-index:0}
.bg::after{content:"";position:absolute;right:-12%;top:0;bottom:0;width:46%;background:linear-gradient(110deg,transparent 0,transparent 8%,rgba(216,52,79,.9) 8.2%,rgba(216,52,79,.9) 10%,var(--ice) 10.2%,rgba(121,193,238,.35));clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);opacity:.55}
.sp{position:fixed;width:var(--s);height:var(--s);left:var(--x);top:var(--y);z-index:1;animation:tw var(--d) ease-in-out infinite;pointer-events:none;color:var(--ice)}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;font-size:11px;letter-spacing:.12em}
.top b{background:var(--bar);color:var(--barink);padding:3px 10px;transform:skewX(-12deg);font-weight:600}
.view{position:fixed;inset:0;z-index:3;padding:52px 18px 64px;overflow-y:auto;display:none}
.view.on{display:block;animation:in .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateX(-40px) skewX(-6deg)}to{opacity:1;transform:none}}
.wrap{max-width:760px;margin:0 auto}
.kick{font-size:12px;letter-spacing:.3em;color:var(--red);font-weight:600}
.big{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(54px,15vw,104px);line-height:1;margin:6px 0 12px;display:flex;flex-wrap:wrap;gap:2px}
.big span,.mi span{display:inline-block;padding:0 .08em;transform:rotate(var(--r,0deg))}
.l0{background:var(--bar);color:var(--barink)}.l1{background:#fff;color:#1a2030;box-shadow:0 0 0 2px #1a2030}.l2{background:var(--red);color:#fff}.l3{background:var(--ice);color:#1a2030}
.sp-w{width:.35em;background:none!important;box-shadow:none!important}
.desc{background:var(--card);backdrop-filter:blur(8px);border-left:4px solid var(--red);padding:10px 14px;font-size:14px;line-height:1.6;max-width:440px;margin-bottom:22px;animation:in .8s .2s both}
.menu{list-style:none;padding:0;display:grid;gap:4px;max-width:420px}
.mi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--ink);font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(38px,10vw,56px);letter-spacing:.04em;padding:2px 14px;cursor:pointer;text-align:left;transition:.25s;transform:skewX(-8deg)}
.mi .ar{margin-left:auto;opacity:0;font-size:.5em}
.mi.sel{background:var(--bar);color:var(--barink);transform:skewX(-8deg) translateX(14px);box-shadow:6px 6px 0 var(--red)}
.mi.sel .ar{opacity:1;color:var(--red);animation:nudge .7s infinite alternate}
@keyframes nudge{to{transform:translateX(-8px)}}
.back{position:absolute;right:16px;top:60px;background:var(--bar);color:var(--barink);border:0;font:600 12px Oswald,sans-serif;letter-spacing:.14em;padding:6px 12px;cursor:pointer;transform:skewX(-12deg)}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5);box-shadow:0 8px 24px rgba(20,30,60,.15);padding:14px 16px;margin-bottom:12px;position:relative;animation:in .5s both}
.card h3{font-family:"Bebas Neue",Impact,sans-serif;font-size:26px;letter-spacing:.04em}
.card p{font-size:13px;line-height:1.55;margin:4px 0 8px}
.chip{display:inline-block;font-size:10px;letter-spacing:.1em;background:var(--bar);color:var(--barink);padding:2px 8px;margin:0 4px 4px 0;transform:skewX(-10deg)}
.sk{margin-bottom:12px;font-size:12px;letter-spacing:.12em}
.sk .t{height:10px;background:rgba(120,130,150,.25);margin-top:4px;transform:skewX(-20deg);overflow:hidden}
.sk .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ice),var(--red));transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
h4{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;letter-spacing:.08em;margin:14px 0 8px;color:var(--red)}
.paper{background:#fffdf8;color:#1a2030;padding:16px;transform:rotate(-1.2deg);box-shadow:0 10px 26px rgba(20,30,60,.25);font-size:14px;line-height:1.7;border-top:6px solid var(--red)}
.paper b{background:var(--ice);padding:0 4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);backdrop-filter:blur(8px);padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink);border-left:5px solid var(--ice);transition:.25s}
.row:hover,.row:focus{border-left-color:var(--red);transform:translateX(8px)}
.row em{font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--red);width:74px}
.row span{font-size:14px;flex:1;word-break:break-all}.row u{text-decoration:none;font-size:11px;background:var(--bar);color:var(--barink);padding:3px 10px;letter-spacing:.1em}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;gap:14px;z-index:5;font-size:10px;letter-spacing:.14em;pointer-events:none}
.hint b{background:var(--bar);color:var(--barink);padding:1px 6px;margin-right:4px}
.wipe{position:fixed;inset:0;z-index:9;background:linear-gradient(110deg,var(--bar) 50%,var(--red) 50%);transform:translateX(-110%) skewX(-12deg);pointer-events:none}
.wipe.go{animation:wp .7s ease-in-out}
@keyframes wp{0%{transform:translateX(-110%) skewX(-12deg)}45%,55%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(110%) skewX(-12deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{position:absolute;top:0;right:0;height:100%;width:min(62vw,560px);object-fit:cover;object-position:30% 20%;opacity:.85;-webkit-mask-image:linear-gradient(to left,#000 50%,transparent);mask-image:linear-gradient(to left,#000 50%,transparent);pointer-events:none;animation:in 1s .1s both}
.wrap{position:relative;z-index:1}
@media (max-width:600px){.hero{width:90vw;opacity:.5}}
.pol{float:left;width:112px;height:130px;object-fit:cover;object-position:50% 30%;border:6px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);transform:rotate(-4deg);margin:0 14px 6px 0}
.banner{display:block;width:100%;height:170px;object-fit:cover;object-position:50% 25%;margin-bottom:14px;clip-path:polygon(0 0,100% 0,100% 82%,96% 100%,0 100%)}
.mus{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);z-index:6;background:var(--bar);color:var(--barink);border:0;font:600 11px Oswald,sans-serif;letter-spacing:.14em;padding:7px 12px;cursor:pointer;transform:skewX(-12deg)}
.mus.on i{display:inline-block;animation:nudge .5s infinite alternate}

.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gal figure{background:#fffdf8;padding:6px 6px 22px;box-shadow:0 8px 20px rgba(20,30,60,.25);cursor:pointer;transform:rotate(-1.5deg);animation:in .5s both;transition:.25s}
.gal figure:nth-child(even){transform:rotate(1.5deg)}
.gal figure:hover{transform:scale(1.04) rotate(0)}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
#lb{position:fixed;inset:0;z-index:8;background:rgba(10,12,18,.9);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:92%;max-height:86%;border:6px solid #fff}
</style>
</head>

function decode(){if(buf)return Promise.resolve(buf);var s=atob(AUD.split(",")[1]),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Promise(function(ok,no){var r=ac.decodeAudioData(u.buffer,function(x){buf=x;ok(x)},no);if(r&&r.catch)r.catch(no)})}
function startM(){if(!want||srcN||!AC)return;ac=ac||new AC();if(!gn){gn=ac.createGain();gn.gain.value=.9;gn.connect(ac.destination)}if(ac.resume)ac.resume();
 decode().then(function(b){if(srcN||!want)return;srcN=ac.createBufferSource();srcN.buffer=b;srcN.loop=true;srcN.connect(gn);srcN.start(0);ui()}).catch(function(e){mb.querySelector("span").textContent="MUSIK ERROR"})}
function stopM(){if(srcN){try{srcN.stop()}catch(e){}srcN.disconnect();srcN=null}ui()}
mb.onclick=function(e){e.stopPropagation();if(srcN){want=false;stopM()}else{want=true;startM()}};
var evs=["pointerdown","touchend","click","keydown"];
function first(e){if(e.target===mb||mb.contains(e.target))return;evs.forEach(function(v){document.removeEventListener(v,first,true)});startM()}
evs.forEach(function(v){document.addEventListener(v,first,true)});
ui();

$("#glist").innerHTML=G.map(function(s,i){return '<figure style="animation-delay:'+i*.08+'s"><img alt="Foto '+(i+1)+'" src="'+s+'"></figure>'}).join("");
$$("#glist img").forEach(function(im){im.parentNode.onclick=function(){$("#lb img").src=im.src;$("#lb").classList.add("on")}});
$("#lb").onclick=function(){this.classList.remove("on")};
</script>
</body>
</html>
